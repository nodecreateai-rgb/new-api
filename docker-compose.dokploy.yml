# Dokploy 部署参考：在 Dokploy 中选择本文件作为 Compose 路径（或对照字段合并进自有 compose）。
#
# Traefik / 公网路由（重要）：
# - 在 Dokploy UI → Domains 里为服务 **new-api** 绑定域名，内部端口 **3000**，保存后 **Redeploy**。
#   Dokploy 会自动注入 traefik.* 标签，并把 **new-api** 接到 Traefik 可达的网络（非隔离部署常见为
#   dokploy-network；隔离部署时为项目专有网络）。
# - 本文件**不**声明外部网络 dokploy-network、**不**写 traefik.docker.network 标签，避免与「隔离部署」
#   所用网络名不一致时出现 502 / 路由失败。若 Preview Compose 里没有任何 traefik 行，说明 Domains
#   未配置或未重新部署。
#
# 端口：容器内监听见 Dockerfile `PORT=3000`；Domains 填 3000，不要填宿主机映射端口（如 3060）。
#
# MySQL：仅挂在 `new-api-internal`，不对外暴露 3306。
#
# 在 Dokploy 环境变量中设置（勿提交真实密码到仓库）；完整示例见 docs/env.dokploy.example。

services:
  new-api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    expose:
      - "3000"
    # 仅绑定本机时可取消注释，用于 SSH 隧道排错；生产建议依赖 Traefik 443，不要长期暴露公网。
    # ports:
    #   - "127.0.0.1:3060:3000"
    environment:
      PORT: "3000"
      TZ: Asia/Shanghai
      SQL_DSN: ${SQL_DSN}
      SESSION_SECRET: ${SESSION_SECRET:-}
    volumes:
      - new_api_data:/data
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - new-api-internal
    stop_grace_period: 30s
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:3000/api/status | grep -q '\"success\"' || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  mysql:
    image: mysql:8
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in Dokploy}
      MYSQL_DATABASE: new-api
      TZ: Asia/Shanghai
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - new-api-internal
    stop_grace_period: 60s
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'mysqladmin ping -h 127.0.0.1 -uroot -p"$$MYSQL_ROOT_PASSWORD" || exit 1',
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

volumes:
  new_api_data:
  mysql_data:

networks:
  new-api-internal:
    driver: bridge
