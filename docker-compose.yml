# New-API Docker Compose
#
# 本地：docker compose up -d，默认映射 ${HOST_PORT:-3060}:3000
# Dokploy：用本文件或 docker-compose.dokploy.yml；在 UI → Domains 绑定服务 new-api、端口 3000，
#         由 Dokploy 注入 Traefik 标签与公网网络。不要手写 dokploy-network / 旧项目网络名。
#
# ⚠️ 生产环境请通过环境变量覆盖默认密码与密钥（见 docs/env.dokploy.example / .env.example）。

version: "3.4"

services:
  new-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${NEW_API_IMAGE:-new-api:latest}
    restart: always
    command: --log-dir /app/logs
    working_dir: /
    expose:
      - "3000"
    # 本地直连时可取消注释；Dokploy 生产请用 Domains/Traefik，勿长期暴露公网端口。
    # ports:
    #   - "${HOST_PORT:-3060}:3000"
    volumes:
      - ./data:/data
      - ./logs:/app/logs
    environment:
      - PORT=3000
      - TZ=Asia/Shanghai
      - SQL_DSN=${SQL_DSN:-postgresql://root:123456@postgres:5432/new-api}
      - REDIS_CONN_STRING=${REDIS_CONN_STRING:-redis://:123456@redis:6379}
      - SESSION_SECRET=${SESSION_SECRET:-}
      - ERROR_LOG_ENABLED=${ERROR_LOG_ENABLED:-true}
      - BATCH_UPDATE_ENABLED=${BATCH_UPDATE_ENABLED:-true}
      - NODE_NAME=${NODE_NAME:-new-api-node-1}
      - TASK_TIMEOUT_MINUTES=${TASK_TIMEOUT_MINUTES:-120}
      - TASK_PRICE_PATCH=${TASK_PRICE_PATCH:-sd2.5,sd2-c1,sd2-c2,sd2-c3,sd2-c5,sd2-c6,sd2-c7,sd2-c8,sd2-c9,sd2-c10,sd2-c11,sd2-c12,sd2-mini,sd2-fast,seedance-720,gemini-omni,happyhorse-1.1-720p,happyhorse-1.1-1080p,wan2.7-720p,wan2.7-1080p,viduq3-turbo-720p,viduq3-turbo-1080p,viduq3-pro-1080p,kling-v3-720p,kling-v3-1080p,kling-v3-4k,kling,kling-o3,可灵,grok-imagine-1.5,grok,sora-2-720p,sora-2-1080p,sora-2-pro,sora-2-pro-720p,sora-2-pro-1080p,sora2,Sora,Sora 2,seedance-2.0-fast-720p,seedance-2.0-720p,seedance-2.0-1080p}
      - ADOBE2API_GATEWAY_KEY=${ADOBE2API_GATEWAY_KEY:-}
      - ADOBE_SEEDANCE_CLASSIC_BASE_URL=${ADOBE_SEEDANCE_CLASSIC_BASE_URL:-}
      - SD2_FAST_GATEWAY_KEY=${SD2_FAST_GATEWAY_KEY:-${ADOBE2API_GATEWAY_KEY:-}}
      - SD25_BASE_URL=${SD25_BASE_URL:-}
      - SD25_GATEWAY_KEY=${SD25_GATEWAY_KEY:-${ADOBE2API_GATEWAY_KEY:-}}
      - OAUTH2API_BASE_URL=${OAUTH2API_BASE_URL:-}
      - OAUTH2API_GATEWAY_KEY=${OAUTH2API_GATEWAY_KEY:-${ADOBE2API_GATEWAY_KEY:-}}
    depends_on:
      - redis
      - postgres
    networks:
      - new-api-network
      # Traefik 默认在 dokploy-network 上解析容器 IP；仅内网时 Domains 会配上仍 404。
      - dokploy-network
    labels:
      # 多网卡时强制走 Dokploy/Traefik 所在网络（Domains 注入的 Host 规则仍生效）。
      - traefik.docker.network=dokploy-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O - http://127.0.0.1:3000/api/status | grep -o '\"success\":\\s*true' || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  redis:
    image: redis:latest
    restart: always
    command:
      - redis-server
      - --requirepass
      - "${REDIS_PASSWORD:-123456}"
    networks:
      - new-api-network
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  postgres:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-root}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-123456}
      POSTGRES_DB: ${POSTGRES_DB:-new-api}
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - new-api-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

volumes:
  pg_data:

networks:
  # 应用内网：postgres / redis / new-api。
  new-api-network:
    driver: bridge
  # Dokploy 全局网络：供 Traefik 发现并转发域名流量。
  dokploy-network:
    external: true
