version: "3.4"
services:
  new-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: calciumion/new-api:latest
    container_name: new-api
    restart: always
    command: --log-dir /app/logs
    working_dir: /
    ports:
      - ${HOST_PORT:-3060}:3000
    volumes:
      - ./data:/data
      - ./logs:/app/logs
    environment:
      - SQL_DSN=postgresql://root:123456@postgres:5432/new-api
      - REDIS_CONN_STRING=redis://:123456@redis:6379
      - TZ=Asia/Shanghai
      - ERROR_LOG_ENABLED=true
      - TASK_TIMEOUT_MINUTES=30
      - TASK_PRICE_PATCH=sd2-c1,sd2-c2,sd2-c3,sd2-c5,sd2-c6,sd2-c7,sd2-c8,sd2-c9,sd2-c10
      - BATCH_UPDATE_ENABLED=true
      - NODE_NAME=new-api-node-1
    depends_on:
      - redis
      - postgres
    networks:
      - new-api-network
      - dokploy-network
      - default
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O - http://localhost:3000/api/status | grep -o '"success":\s*true' || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      - traefik.docker.network=dokploy-network
      - traefik.http.routers.paco-llm-0yit87-3-web.rule=Host(`llm.chre3.com`)
      - traefik.http.routers.paco-llm-0yit87-3-web.entrypoints=web
      - traefik.http.services.paco-llm-0yit87-3-web.loadbalancer.server.port=3000
      - traefik.http.routers.paco-llm-0yit87-3-web.service=paco-llm-0yit87-3-web
      - traefik.http.routers.paco-llm-0yit87-3-web.middlewares=redirect-to-https@file
      - traefik.http.routers.paco-llm-0yit87-3-websecure.rule=Host(`llm.chre3.com`)
      - traefik.http.routers.paco-llm-0yit87-3-websecure.entrypoints=websecure
      - traefik.http.services.paco-llm-0yit87-3-websecure.loadbalancer.server.port=3000
      - traefik.http.routers.paco-llm-0yit87-3-websecure.service=paco-llm-0yit87-3-websecure
      - traefik.http.routers.paco-llm-0yit87-3-websecure.tls.certresolver=letsencrypt
      - traefik.enable=true
  redis:
    image: redis:latest
    container_name: redis
    restart: always
    command:
      - redis-server
      - --requirepass
      - "123456"
    networks:
      - new-api-network
  postgres:
    image: postgres:15
    container_name: postgres
    restart: always
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: new-api
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - new-api-network
volumes:
  pg_data: null
networks:
  new-api-network:
    driver: bridge
  dokploy-network:
    external: true
