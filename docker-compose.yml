# New-API Docker Compose
#
# 本地：docker compose up -d
# Dokploy：Domains 绑定服务 new-api、端口 3000；Environment 中 SQL_DSN 主机名须为 mysql
#         （与下方 mysql 服务名一致），例如：
#         root:<密码>@tcp(mysql:3306)/new-api?charset=utf8mb4
#
# ⚠️ 生产请在 Dokploy Environment 覆盖密码/密钥，勿提交真实密钥到仓库。

version: "3.4"

services:
  new-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${NEW_API_IMAGE:-new-api:latest}
    restart: always
    command: --log-dir /app/logs
    working_dir: /
    expose:
      - "3000"
    # 本地直连时可取消注释；Dokploy 生产请用 Domains/Traefik。
    # ports:
    #   - "${HOST_PORT:-3060}:3000"
    volumes:
      - ./data:/data
      - ./logs:/app/logs
    environment:
      - PORT=3000
      - TZ=Asia/Shanghai
      - SQL_DSN=${SQL_DSN:-root:123456@tcp(mysql:3306)/new-api?charset=utf8mb4}
      - REDIS_CONN_STRING=${REDIS_CONN_STRING:-redis://:123456@redis:6379}
      - SESSION_SECRET=${SESSION_SECRET:-}
      - ERROR_LOG_ENABLED=${ERROR_LOG_ENABLED:-true}
      - BATCH_UPDATE_ENABLED=${BATCH_UPDATE_ENABLED:-true}
      - NODE_NAME=${NODE_NAME:-new-api-node-1}
      - TASK_TIMEOUT_MINUTES=${TASK_TIMEOUT_MINUTES:-120}
      - TASK_PRICE_PATCH=${TASK_PRICE_PATCH:-sd2.5,sd2-c1,sd2-c2,sd2-c3,sd2-c5,sd2-c6,sd2-c7,sd2-c8,sd2-c9,sd2-c10,sd2-c11,sd2-c12,sd2-mini,sd2-fast,seedance-720,gemini-omni,happyhorse-1.1-720p,happyhorse-1.1-1080p,wan2.7-720p,wan2.7-1080p,viduq3-turbo-720p,viduq3-turbo-1080p,viduq3-pro-1080p,kling-v3-720p,kling-v3-1080p,kling-v3-4k,kling,kling-o3,可灵,grok-imagine-1.5,grok,sora-2-720p,sora-2-1080p,sora-2-pro,sora-2-pro-720p,sora-2-pro-1080p,sora2,Sora,Sora 2,seedance-2.0-fast-720p,seedance-2.0-720p,seedance-2.0-1080p}
      - ADOBE2API_GATEWAY_KEY=${ADOBE2API_GATEWAY_KEY:-}
      - ADOBE_SEEDANCE_CLASSIC_BASE_URL=${ADOBE_SEEDANCE_CLASSIC_BASE_URL:-}
      - SD2_FAST_GATEWAY_KEY=${SD2_FAST_GATEWAY_KEY:-${ADOBE2API_GATEWAY_KEY:-}}
      - SD25_BASE_URL=${SD25_BASE_URL:-}
      - SD25_GATEWAY_KEY=${SD25_GATEWAY_KEY:-${ADOBE2API_GATEWAY_KEY:-}}
      - OAUTH2API_BASE_URL=${OAUTH2API_BASE_URL:-}
      - OAUTH2API_GATEWAY_KEY=${OAUTH2API_GATEWAY_KEY:-${ADOBE2API_GATEWAY_KEY:-}}
    depends_on:
      redis:
        condition: service_started
      mysql:
        condition: service_healthy
    networks:
      - new-api-network
      - dokploy-network
    labels:
      - traefik.docker.network=dokploy-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O - http://127.0.0.1:3000/api/status | grep -o '\"success\":\\s*true' || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  redis:
    image: redis:latest
    restart: always
    command:
      - redis-server
      - --requirepass
      - "${REDIS_PASSWORD:-123456}"
    networks:
      - new-api-network
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  mysql:
    image: mysql:8
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-new-api}
      TZ: Asia/Shanghai
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - new-api-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'mysqladmin ping -h 127.0.0.1 -uroot -p"$$MYSQL_ROOT_PASSWORD" || exit 1',
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

volumes:
  mysql_data:

networks:
  new-api-network:
    driver: bridge
  dokploy-network:
    external: true
