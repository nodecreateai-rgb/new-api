# New-API Docker Compose
#
# 本地：docker compose up -d
# Dokploy：Domains 绑定服务 new-api、端口 3000；主库/日志库均使用 ClickHouse，例如：
#   SQL_DSN=clickhouse://default:<密码>@domiex-clickhouse-xxx-clickhouse-1:9000/new_api
#   LOG_SQL_DSN=clickhouse://default:<密码>@domiex-clickhouse-xxx-clickhouse-1:9000/new_api_logs
# （LOG_SQL_DSN 可留空，此时日志写入主库 new_api.logs）
#
# ⚠️ 生产请在 Dokploy Environment 覆盖密码/密钥，勿提交真实密钥到仓库。

version: "3.4"

services:
  new-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${NEW_API_IMAGE:-new-api:latest}
    restart: always
    command: --log-dir /app/logs
    working_dir: /
    expose:
      - "3000"
    # 本地直连时可取消注释；Dokploy 生产请用 Domains/Traefik。
    # ports:
    #   - "${HOST_PORT:-3060}:3000"
    volumes:
      - ./data:/data
      - ./logs:/app/logs
    environment:
      - PORT=3000
      - TZ=Asia/Shanghai
      - SQL_DSN=${SQL_DSN:-clickhouse://default:password@clickhouse:9000/new_api}
      - LOG_SQL_DSN=${LOG_SQL_DSN:-}
      - LOG_SQL_CLICKHOUSE_TTL_DAYS=${LOG_SQL_CLICKHOUSE_TTL_DAYS:-0}
      - REDIS_CONN_STRING=${REDIS_CONN_STRING:-redis://:123456@redis:6379}
      - SESSION_SECRET=${SESSION_SECRET:-}
      - ERROR_LOG_ENABLED=${ERROR_LOG_ENABLED:-true}
      - BATCH_UPDATE_ENABLED=${BATCH_UPDATE_ENABLED:-true}
      - NODE_NAME=${NODE_NAME:-new-api-node-1}
      - TASK_TIMEOUT_MINUTES=${TASK_TIMEOUT_MINUTES:-120}
      - TASK_PRICE_PATCH=${TASK_PRICE_PATCH:-sd2.5,sd2-c1,sd2-c2,sd2-c3,sd2-c5,sd2-c6,sd2-c7,sd2-c8,sd2-c9,sd2-c10,sd2-c11,sd2-c12,sd2-mini,sd2-fast,seedance-720,seedance-2.0-mini,seedance-2.0-mini-480p,gemini-omni,happyhorse-1.1-720p,happyhorse-1.1-1080p,wan2.7-720p,wan2.7-1080p,viduq3-turbo-720p,viduq3-turbo-1080p,viduq3-pro-1080p,kling-v3-720p,kling-v3-1080p,kling-v3-4k,kling,kling-o3,可灵,grok-imagine-1.5,grok,sora-2-720p,sora-2-1080p,sora-2-pro,sora-2-pro-720p,sora-2-pro-1080p,sora2,Sora,Sora 2,seedance-2.0-fast-720p,seedance-2.0-720p,seedance-2.0-1080p}
      - ADOBE2API_GATEWAY_KEY=${ADOBE2API_GATEWAY_KEY:-}
      - DOLA2API_BASE_URL=${DOLA2API_BASE_URL:-http://dola2api:38472}
      - DOLA2API_GATEWAY_KEY=${DOLA2API_GATEWAY_KEY:-${ADOBE2API_GATEWAY_KEY:-}}
      - ROBONEO2API_BASE_URL=${ROBONEO2API_BASE_URL:-http://roboneo2api:38688}
      - ROBONEO2API_GATEWAY_KEY=${ROBONEO2API_GATEWAY_KEY:-${ROBONEO2API_API_KEY:-${ADOBE2API_GATEWAY_KEY:-}}}
      - ADOBE_SEEDANCE_CLASSIC_BASE_URL=${ADOBE_SEEDANCE_CLASSIC_BASE_URL:-}
      - SD2_FAST_GATEWAY_KEY=${SD2_FAST_GATEWAY_KEY:-${ADOBE2API_GATEWAY_KEY:-}}
      - SD25_BASE_URL=${SD25_BASE_URL:-}
      - SD25_GATEWAY_KEY=${SD25_GATEWAY_KEY:-${ADOBE2API_GATEWAY_KEY:-}}
      - OAUTH2API_BASE_URL=${OAUTH2API_BASE_URL:-}
      - OAUTH2API_GATEWAY_KEY=${OAUTH2API_GATEWAY_KEY:-${ADOBE2API_GATEWAY_KEY:-}}
    depends_on:
      redis:
        condition: service_started
    networks:
      - new-api-network
      - dokploy-network
    # Traefik labels MUST live in compose: a plain `docker compose up --force-recreate`
    # drops Dokploy UI-injected domain labels and makes llm.domie.studio /
    # llm.chre3.com return Traefik's plain "404 page not found". Keep these in
    # sync with Dokploy Domains (compose app domiex-llm-x4xe86, service new-api, port 3000).
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network
      - traefik.http.routers.domiex-llm-x4xe86-5-web.rule=Host(`llm.domie.studio`) || Host(`llm.chre3.com`)
      - traefik.http.routers.domiex-llm-x4xe86-5-web.entrypoints=web
      - traefik.http.routers.domiex-llm-x4xe86-5-web.middlewares=redirect-to-https@file
      - traefik.http.routers.domiex-llm-x4xe86-5-web.service=domiex-llm-x4xe86-5-web
      - traefik.http.services.domiex-llm-x4xe86-5-web.loadbalancer.server.port=3000
      - traefik.http.routers.domiex-llm-x4xe86-5-websecure.rule=Host(`llm.domie.studio`) || Host(`llm.chre3.com`)
      - traefik.http.routers.domiex-llm-x4xe86-5-websecure.entrypoints=websecure
      - traefik.http.routers.domiex-llm-x4xe86-5-websecure.tls=true
      - traefik.http.routers.domiex-llm-x4xe86-5-websecure.service=domiex-llm-x4xe86-5-websecure
      - traefik.http.services.domiex-llm-x4xe86-5-websecure.loadbalancer.server.port=3000
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O - http://127.0.0.1:3000/api/status | grep -o '\"success\":\\s*true' || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  redis:
    image: redis:latest
    restart: always
    command:
      - redis-server
      - --requirepass
      - "${REDIS_PASSWORD:-123456}"
    networks:
      - new-api-network
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

networks:
  new-api-network:
    driver: bridge
  dokploy-network:
    external: true
